syntax = "proto3";

package aseman.module.control.v1;

message ProtocolVersion { uint32 major = 1; uint32 minor = 2; }

message Handshake {
  ProtocolVersion protocol = 1;
  string provider_kind = 2;
  string implementation_version = 3;
  repeated string capabilities = 4;
  uint64 max_message_bytes = 5;
  repeated string schema_digests = 6;
  string instance_id = 7;
}

message RequestMetadata {
  string request_id = 1;
  string trace_id = 2;
  int64 deadline_unix_millis = 3;
  string cancellation_id = 4;
  string idempotency_key = 5;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_PERMISSION_DENIED = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_CONFLICT = 5;
  ERROR_CODE_UNSUPPORTED = 6;
  ERROR_CODE_DEADLINE_EXCEEDED = 7;
  ERROR_CODE_CANCELLED = 8;
  ERROR_CODE_UNAVAILABLE = 9;
  ERROR_CODE_INTERNAL = 10;
}

message ModuleError {
  ErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
  string request_id = 4;
  map<string, string> details = 5;
}

message LifecycleRequest { RequestMetadata meta = 1; string module_key = 2; }
message LifecycleResponse { uint64 routing_generation = 1; string state = 2; ModuleError error = 3; }
message HealthRequest { RequestMetadata meta = 1; }
message HealthResponse { bool live = 1; bool ready = 2; string detail = 3; }
message CancelRequest { string cancellation_id = 1; }
message CancelResponse { bool accepted = 1; }

service ModuleControl {
  rpc Negotiate(Handshake) returns (Handshake);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Stage(LifecycleRequest) returns (LifecycleResponse);
  rpc Restore(LifecycleRequest) returns (LifecycleResponse);
  rpc Drain(LifecycleRequest) returns (LifecycleResponse);
  rpc Stop(LifecycleRequest) returns (LifecycleResponse);
  rpc Cancel(CancelRequest) returns (CancelResponse);
}
