[workspace]
resolver = "2"
# The backend family directory holds member crates of its own.
exclude = ["modules/consensus", "modules/federation", "modules/finance", "modules/network", "modules/realtime", "modules/runtime", "modules/security", "modules/storage", "modules/vmm-backend"]
members = [
  "apps/aseman-meter",
  "apps/aseman-node",
  "apps/aseman-vmm",
  "apps/aseman-vmm-agent",
  "apps/asemanctl",
  "crates/*",
  "modules/*",
  "modules/network/http",
  "modules/network/legacy",
  "modules/federation/http",
  "modules/consensus/hashgraph",
  "modules/finance/ledger",
  "modules/realtime/durable",
  "modules/runtime/docker",
  "modules/runtime/elpian",
  "modules/runtime/elpian/crates/elpian-vm",
  "modules/runtime/elpify",
  "modules/runtime/elpify/crates/elpify-lang",
  "modules/runtime/firecracker",
  "modules/runtime/javascript",
  "modules/runtime/modal",
  "modules/runtime/sdk-legacy",
  "modules/runtime/wasm",
  "modules/security/capabilities",
  "modules/storage/postgres",
  "modules/storage/rocksdb-legacy",
  "modules/vmm-backend/native-legacy",
  "modules/vmm-backend/native-legacy/crates/caspar-vm-plugins",
  "modules/vmm-backend/nomad",
  "tests/contracts/module",
  "tests/contracts/policy",
  "tests/contracts/vmm-backend",
  "tests/contracts/storage",
  "tests/migration",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/cosmopole-org/caspar"

[workspace.dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
bs58 = "0.5.1"
hex = "0.4.3"
prost = "0.13.5"
postgres = "0.19.13"
r2d2 = "0.8.10"
r2d2_postgres = "0.18.2"
regex = "1.12.3"
rocksdb = "0.24.0"
ring = "0.17.14"
rsa = { version = "0.9.10", features = ["sha2"] }
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tonic = { version = "0.12.3", features = ["transport"] }
toml = "1.1.6"
uuid = { version = "1.23.1", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
