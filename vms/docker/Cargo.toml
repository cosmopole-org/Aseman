[package]
name = "caspar-vm-docker"
version = "0.1.0"
edition = "2021"
description = "Caspar VM plugin: Docker container runtime (key: docker)"

[lib]
name = "caspar_vm_docker"
path = "src/lib.rs"

[dependencies]
aseman-config = { path = "../../crates/aseman-config" }
caspar-vm-sdk = { path = "../../vm-sdk" }
base64 = "0.22"
bollard = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
tar = "0.4"
tokio = { version = "1", features = ["rt", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
