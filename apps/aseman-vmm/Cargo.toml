[package]
name = "aseman-vmm"
description = "The provider-neutral VMM service (plan 04, ADR 0029): A501 over mutual TLS, with its backend behind A504."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aseman-application = { path = "../../crates/aseman-application" }
aseman-config = { path = "../../crates/aseman-config" }
aseman-contracts = { path = "../../crates/aseman-contracts" }
aseman-ports = { path = "../../crates/aseman-ports" }
aseman-storage-postgres = { path = "../../modules/storage-postgres" }
aseman-vmm-backend-grpc = { path = "../../modules/vmm-backend-grpc" }
aseman-vmm-http = { path = "../../modules/vmm-http" }
axum = { version = "0.7.9", default-features = false, features = ["http1", "tokio"] }
rustls-pemfile = "2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio = { workspace = true, features = ["net", "signal", "sync", "time"] }

[lints]
workspace = true
