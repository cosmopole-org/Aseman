[package]
name = "asemanctl"
description = "Canonical Aseman administrative CLI implementation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "asemanctl"


[dependencies]
aseman-admin-http = { path = "../../crates/aseman-admin-http" }
aseman-config = { path = "../../crates/aseman-config" }
aseman-domain = { path = "../../crates/aseman-domain" }
aseman-fs = { path = "../../crates/aseman-fs" }
aseman-storage-providers = { path = "../../crates/aseman-storage-providers" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
anyhow.workspace = true
base64.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ctrlc = "3.4"
clap = { version = "4", features = ["derive"] }
hex.workspace = true
regex.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true

[lints]
workspace = true
