[package]
name = "aseman-node"
description = "Canonical Aseman node implementation and composition root."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "aseman-node"

[[bin]]
name = "aseman-node"
path = "src/runner.rs"


[dependencies]
aseman-application = { path = "../../crates/aseman-application" }
aseman-config = { path = "../../crates/aseman-config" }
aseman-contracts = { path = "../../crates/aseman-contracts" }
aseman-domain = { path = "../../crates/aseman-domain" }
aseman-module-runtime = { path = "../../crates/aseman-module-runtime" }
aseman-network-legacy = { path = "../../modules/network/legacy" }
aseman-observability = { path = "../../crates/aseman-observability" }
aseman-ports = { path = "../../crates/aseman-ports" }
aseman-capsule = { path = "../../crates/aseman-capsule" }
aseman-consensus-hashgraph = { path = "../../modules/consensus/hashgraph" }
aseman-storage = { path = "../../crates/aseman-storage" }
aseman-storage-providers = { path = "../../crates/aseman-storage-providers" }
aseman-storage-rocksdb = { path = "../../modules/storage/rocksdb" }
aseman-storage-postgres = { path = "../../modules/storage/postgres" }
aseman-policy-native = { path = "../../modules/security/capabilities" }
aseman-public-http = { path = "../../modules/network/http" }
aseman-gateway-rpc = { path = "../../modules/network/gateway" }
aseman-federation-http = { path = "../../modules/federation/http" }
aseman-public-service = { path = "../../modules/public-service" }
aseman-realtime-durable = { path = "../../modules/realtime/durable" }
aseman-identity-native = { path = "../../modules/identity-native" }
aseman-guest-http = { path = "../../modules/guest-http" }
aseman-vmm-http = { path = "../../modules/vmm-http" }
anyhow = "1.0.102"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5.15"
dashmap = "6.2.1"
getrandom = "0.2"
hex = "0.4.3"
libc = "0.2"
log = "0.4.29"
num-bigint = "0.4.6"
postgres = "0.19.13"
r2d2 = "0.8.10"
r2d2_postgres = "0.18.2"
rand = "0.10.1"
ring.workspace = true
rocksdb.workspace = true
rsa.workspace = true
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_repr = "0.1.20"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.18"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
uuid = { version = "1.23.1", features = ["v4"] }
url = "2.5.8"
pprof = { version = "0.13", features = ["flamegraph", "protobuf-codec"] }
futures-util = "0.3"
once_cell = "1"
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }
tonic.workspace = true

[dev-dependencies]
aseman-ports = { path = "../../crates/aseman-ports", features = ["conformance"] }
