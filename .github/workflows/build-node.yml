name: Build and attest Aseman release artifacts

# A906 replacement for the legacy workflow that committed compiled blobs to dist/.
# This workflow only publishes immutable workflow artifacts and attestations. RL-018
# keeps tracked dist/ until a real tagged run has been verified and the rollback gate
# authorizes deletion.
on:
  workflow_dispatch:
    inputs:
      wasmedge_version:
        description: Pinned WasmEdge release used by the compatibility runtime
        required: false
        default: 0.17.1
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write
  attestations: write
  checks: write

concurrency:
  group: aseman-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, inventory, and attest (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out the attested source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install native build prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake curl file libclang-dev pkg-config
          rustup show active-toolchain

      - name: Enforce repository release and license policy
        run: python3 scripts/check_release_policy.py --check

      - name: Audit Cargo.lock against RustSec
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build into an untracked release staging directory
        env:
          RELEASE_ROOT: ${{ runner.temp }}/aseman-dist
          WASMEDGE_VERSION: ${{ inputs.wasmedge_version || '0.17.1' }}
        run: |
          set -euo pipefail
          ./scripts/build-dist.sh \
            --dist-dir "$RELEASE_ROOT" \
            --wasmedge-ver "$WASMEDGE_VERSION"
          test -x "$RELEASE_ROOT/bin/aseman-node"
          test -x "$RELEASE_ROOT/bin/asemanctl"

      - name: Scan packaged files for high and critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          path: ${{ runner.temp }}/aseman-dist
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: ${{ runner.temp }}/grype-${{ matrix.arch }}.json

      - name: Create deterministic archive, SPDX SBOM, and checksums
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_ROOT: ${{ runner.temp }}/aseman-dist
          RELEASE_OUT: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_OUT"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          version="${GITHUB_REF_NAME#v}"
          archive="aseman-dist-${ARCH}.tgz"
          sbom="aseman-dist-${ARCH}.spdx.json"
          scan="aseman-dist-${ARCH}.vulnerabilities.json"
          cp "${RUNNER_TEMP}/grype-${ARCH}.json" "$RELEASE_OUT/$scan"
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 \
            --numeric-owner --use-compress-program='gzip -n' \
            -cf "$RELEASE_OUT/$archive" -C "$RELEASE_ROOT" .
          python3 scripts/generate_release_sbom.py \
            --artifact-root "$RELEASE_ROOT" \
            --output "$RELEASE_OUT/$sbom" \
            --name "aseman-dist-${ARCH}" \
            --version "$version" \
            --namespace "https://github.com/${GITHUB_REPOSITORY}/spdx/${GITHUB_SHA}/${ARCH}"
          (
            cd "$RELEASE_OUT"
            sha256sum "$archive" "$sbom" "$scan" > "aseman-dist-${ARCH}.SHA256SUMS"
          )

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/release/aseman-dist-${{ matrix.arch }}.tgz

      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/release/aseman-dist-${{ matrix.arch }}.tgz
          sbom-path: ${{ runner.temp }}/release/aseman-dist-${{ matrix.arch }}.spdx.json

      - name: Publish immutable workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aseman-release-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30
