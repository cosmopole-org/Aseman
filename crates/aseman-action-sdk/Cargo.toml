[package]
name = "aseman-action-sdk"
description = "Interface SDK for Aseman action plugins: the ActionPlugin trait, the ActionContext host bridge, the registry, and the state/wire types the node's actions run on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "aseman_action_sdk"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
aseman-application = { path = "../../crates/aseman-application" }
aseman-capsule = { path = "../../crates/aseman-capsule" }
aseman-contracts = { path = "../../crates/aseman-contracts" }
aseman-domain = { path = "../../crates/aseman-domain" }
aseman-fs = { path = "../../crates/aseman-fs" }
aseman-ports = { path = "../../crates/aseman-ports" }
aseman-storage = { path = "../../crates/aseman-storage" }
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
getrandom = "0.2"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2.workspace = true
uuid = { version = "1.23.1", features = ["v4"] }

[dev-dependencies]
aseman-ports = { path = "../../crates/aseman-ports", features = ["conformance"] }
rsa = { version = "0.9.10", features = ["sha2"] }

[lints]
workspace = true