[package]
name = "caspar-node"
version = "0.1.0"
edition = "2021"
description = "Caspar node — Rust translation of the Caspar (kasper) Go node"

[[bin]]
name = "caspar-node"
path = "src/bin/caspar-node.rs"

[[bin]]
name = "aseman-node"
path = "src/bin/aseman-node.rs"

[[bin]]
name = "caspar-keygen"
path = "src/bin/keygen.rs"

[dependencies]
aseman-application = { path = "../crates/aseman-application" }
aseman-config = { path = "../crates/aseman-config" }
aseman-contracts = { path = "../crates/aseman-contracts" }
aseman-domain = { path = "../crates/aseman-domain" }
aseman-module-runtime = { path = "../crates/aseman-module-runtime" }
aseman-observability = { path = "../crates/aseman-observability" }
aseman-ports = { path = "../crates/aseman-ports" }
aseman-storage-legacy = { path = "../modules/storage-legacy" }
anyhow = "1.0.102"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5.15"
dashmap = "6.2.1"
getrandom = "0.2"
hex = "0.4.3"
k256 = { version = "0.13.4", features = ["ecdsa", "arithmetic"] }
libc = "0.2"
log = "0.4.29"
num-bigint = "0.4.6"
postgres = "0.19.13"
r2d2 = "0.8.10"
r2d2_postgres = "0.18.2"
rand = "0.10.1"
rocksdb.workspace = true
rsa.workspace = true
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_repr = "0.1.20"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.18"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
uuid = { version = "1.23.1", features = ["v4"] }
url = "2.5.8"
pprof = { version = "0.13", features = ["flamegraph", "protobuf-codec"] }

# VMM driver dependencies. The per-runtime crates (wasmedge, bollard, elpify,
# elpian, …) moved into the VM plugin projects under ../vms; the node itself
# only keeps what the VMM host bridge and gateway need.
futures-util = "0.3"
once_cell = "1"
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }
tonic = { workspace = true }

# The VM plugin system: the interface SDK plus the build-time-generated
# aggregation crate that compiles the enabled `vms/` plugin projects into
# this binary (regenerated by `casparctl vms sync`).
caspar-vm-sdk = { path = "../vm-sdk" }
caspar-vm-plugins = { path = "crates/caspar-vm-plugins" }
