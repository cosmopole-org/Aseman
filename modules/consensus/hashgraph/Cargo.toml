rocksdb.workspace = true
rand = "0.10.1"
serde.workspace = true
serde_json.workspace = true
serde_repr = "0.1.20"
sha2 = "0.11.0"
thiserror.workspace = true
uuid = { workspace = true, features = ["v4"] }

