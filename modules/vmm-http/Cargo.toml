[package]
name = "aseman-vmm-http"
description = "The A501 node-to-VMM HTTP transport: the mutual-TLS server over the VMM service and the node's client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aseman-application = { path = "../../crates/aseman-application" }
aseman-contracts = { path = "../../crates/aseman-contracts" }
aseman-domain = { path = "../../crates/aseman-domain" }
aseman-ports = { path = "../../crates/aseman-ports" }
axum = { version = "0.7.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio", "service"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
uuid.workspace = true

[dev-dependencies]
aseman-ports = { path = "../../crates/aseman-ports", features = ["conformance"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

[lints]
workspace = true
