[package]
name = "aseman-action-workloads"
description = "Entity and workload operations (deploy, run, stop, logs, terminals), as an action plugin (ADR 0040)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.102"
aseman-action-sdk = { path = "../../../crates/aseman-action-sdk" }
aseman-application = { path = "../../../crates/aseman-application" }
aseman-contracts = { path = "../../../crates/aseman-contracts" }
aseman-domain = { path = "../../../crates/aseman-domain" }
aseman-ports = { path = "../../../crates/aseman-ports" }
base64 = "0.22.1"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23.1", features = ["v4"] }

[lints]
workspace = true