[package]
name = "aseman-storage-rocksdb"
description = "The RocksDB storage provider (ADR 0033): embedded key/value storage, its OpenRaft cluster mode, and the importers for Aseman-era data."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { workspace = true, features = ["v4"] }
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }
aseman-admin-http = { path = "../../../crates/aseman-admin-http" }
aseman-capsule = { path = "../../../crates/aseman-capsule" }
aseman-config = { path = "../../../crates/aseman-config" }
base64.workspace = true
chacha20poly1305 = "0.10.1"
aseman-contracts = { path = "../../../crates/aseman-contracts" }
aseman-domain = { path = "../../../crates/aseman-domain" }
aseman-fs = { path = "../../../crates/aseman-fs" }
aseman-ports = { path = "../../../crates/aseman-ports" }
aseman-postgres = { path = "../../../crates/aseman-postgres" }
aseman-storage = { path = "../../../crates/aseman-storage" }
postgres.workspace = true
rocksdb.workspace = true
rsa.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
aseman-admin-http = { path = "../../../crates/aseman-admin-http", features = ["testing"] }
aseman-storage = { path = "../../../crates/aseman-storage", features = ["conformance"] }
aseman-ports = { path = "../../../crates/aseman-ports", features = ["conformance"] }
aseman-storage-conformance = { path = "../../../tests/contracts/storage" }

[lints]
workspace = true
