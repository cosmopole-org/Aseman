[package]
name = "aseman-vmm-backend-nomad"
description = "The Nomad VMM backend (P6-01): Aseman workloads as Nomad jobs behind A504."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "aseman-vmm-backend-nomad"
path = "src/main.rs"

[dependencies]
aseman-config = { path = "../../../crates/aseman-config" }
aseman-contracts = { path = "../../../crates/aseman-contracts" }
aseman-domain = { path = "../../../crates/aseman-domain" }
aseman-ports = { path = "../../../crates/aseman-ports" }
aseman-vmm-backend-grpc = { path = "../../vmm-backend-grpc" }
base64.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
tonic.workspace = true

[dev-dependencies]
aseman-ports = { path = "../../../crates/aseman-ports", features = ["conformance"] }
aseman-vmm-backend-conformance = { path = "../../../tests/contracts/vmm-backend" }

[lints]
workspace = true
