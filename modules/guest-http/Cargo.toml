[package]
name = "aseman-guest-http"
description = "The guest API transport (A405, P5-04): the node's signed-request server and the workload-side client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aseman-application = { path = "../../crates/aseman-application" }
aseman-contracts = { path = "../../crates/aseman-contracts" }
aseman-domain = { path = "../../crates/aseman-domain" }
aseman-ports = { path = "../../crates/aseman-ports" }
axum = { version = "0.7.9", default-features = false, features = ["http1", "tokio"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio", "service"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

[lints]
workspace = true
