[package]
name = "aseman-federation-http"
description = "Aseman federation HTTP transport and PostgreSQL directory/replay provider."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aseman-application = { path = "../../../crates/aseman-application" }
aseman-contracts = { path = "../../../crates/aseman-contracts" }
aseman-domain = { path = "../../../crates/aseman-domain" }
aseman-ports = { path = "../../../crates/aseman-ports" }
axum = { version = "0.7.9", default-features = false, features = ["http1", "tokio"] }
base64.workspace = true
hex.workspace = true
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio", "service"] }
postgres = { workspace = true, features = ["with-uuid-1"] }
r2d2.workspace = true
r2d2_postgres.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
thiserror.workspace = true

[dev-dependencies]
aseman-config = { path = "../../../crates/aseman-config" }
aseman-policy-native = { path = "../../security/capabilities" }
aseman-ports = { path = "../../../crates/aseman-ports", features = ["conformance"] }
uuid.workspace = true

[lints]
workspace = true
