[package]
name = "aseman-realtime-durable"
description = "PostgreSQL durable event log, outbox, and checkpoint provider for Aseman."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aseman-domain = { path = "../../../crates/aseman-domain" }
aseman-ports = { path = "../../../crates/aseman-ports" }
postgres = { workspace = true, features = ["with-uuid-1"] }
r2d2.workspace = true
r2d2_postgres.workspace = true

[dev-dependencies]
aseman-config = { path = "../../../crates/aseman-config" }
aseman-ports = { path = "../../../crates/aseman-ports", features = ["conformance"] }
uuid.workspace = true

[lints]
workspace = true
