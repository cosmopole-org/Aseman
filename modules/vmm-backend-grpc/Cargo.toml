[package]
name = "aseman-vmm-backend-grpc"
description = "The A504 VMM-backend transport: serve a VmmBackend over gRPC, and the VMM service's client for it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aseman-contracts = { path = "../../crates/aseman-contracts" }
aseman-domain = { path = "../../crates/aseman-domain" }
aseman-ports = { path = "../../crates/aseman-ports" }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tonic.workspace = true
uuid.workspace = true

[dev-dependencies]
aseman-ports = { path = "../../crates/aseman-ports", features = ["conformance"] }
aseman-vmm-backend-conformance = { path = "../../tests/contracts/vmm-backend" }
tokio = { workspace = true, features = ["net"] }
tokio-stream = { version = "0.1", features = ["net"] }

[lints]
workspace = true
