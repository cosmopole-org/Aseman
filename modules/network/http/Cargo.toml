[package]
name = "aseman-public-http"
description = "The A701 hardened public HTTP transport over Aseman's authenticated action service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aseman-contracts = { path = "../../../crates/aseman-contracts" }
aseman-domain = { path = "../../../crates/aseman-domain" }
axum = { version = "0.7.9", default-features = false, features = ["http1", "tokio"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio", "service"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
uuid.workspace = true

[lints]
workspace = true
