[package]
name = "aseman-vm-elpian"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Aseman VM plugin: Elpian AST interpreter runtime (key: elpian)"

[lib]
name = "aseman_vm_elpian"
path = "src/lib.rs"

[dependencies]
aseman-config = { path = "../../../crates/aseman-config" }
aseman-vm-sdk = { path = "../sdk" }
elpian_vm = { path = "crates/elpian-vm", package = "elpian-vm" }
serde_json = "1"
