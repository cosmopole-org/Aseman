[package]
name = "caspar-vm-sdk"
version = "0.1.0"
edition = "2021"
description = "Interface SDK for Caspar VM plugins — every VM type project imports this crate and implements its traits so the compiler can verify all interactions between the VM controller and the Caspar VMM."

[lib]
name = "caspar_vm_sdk"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
