[package]
name = "caspar-vm-wasm"
version = "0.1.0"
edition = "2021"
description = "Caspar VM plugin: WasmEdge-managed WebAssembly runtime (key: wasm, default runtime)"

[lib]
name = "caspar_vm_wasm"
path = "src/lib.rs"

[dependencies]
aseman-config = { path = "../../../crates/aseman-config" }
caspar-vm-sdk = { path = "../sdk-legacy" }
serde_json = "1"
# WasmEdge bindings fetched by cargo from the upstream rust-sdk, pinned to a
# specific commit for reproducibility. WasmEdge 0.17 support only lands in
# wasmedge-sys 0.20, which is not yet published to crates.io — so this is the
# cargo-managed (non-vendored) source for it. The bindings build against the
# libwasmedge already installed on the host (their build.rs searches
# `WASMEDGE_DIR` / `~/.wasmedge` / `/usr/local`). The `aot` feature enables the
# ahead-of-time compiler used by runtime.rs; every AOT failure falls back to the
# interpreter, so a WasmEdge built without LLVM still works.
wasmedge-sys = { git = "https://github.com/WasmEdge/wasmedge-rust-sdk", rev = "3e7d3bf9ad1e0ee5324c05a9e3ba9ce596fd3c59", features = ["aot"] }
wasmedge-types = { git = "https://github.com/WasmEdge/wasmedge-rust-sdk", rev = "3e7d3bf9ad1e0ee5324c05a9e3ba9ce596fd3c59" }

[dev-dependencies]
wat = "1"
